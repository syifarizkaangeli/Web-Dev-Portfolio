<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login.site</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<main class="auth-page">

    <div class="auth-card">

        <p class="eyebrow">ACCOUNT</p>
        <h1>Login Pengguna</h1>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Masukkan alamat email" required>
            <input type="password" id="password" placeholder="Masukkan kata sandi" required>

            <button type="submit" class="btn primary">Masuk</button>

            <p id="status"></p>
        </form>

        <p class="auth-link">Belum memiliki akun? <a href="/regrister.html">Regristasi sekarang.</a></p>

    </div>

</main>

<script>

document.getElementById("loginForm").addEventListener("submit", async (e) => {

    e.preventDefault();

    const status = document.getElementById("status");
    status.textContent = "Memproses...";

    try {

        const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error);
        }

        localStorage.setItem("portfolio_token", result.token);

        status.textContent = "Login berhasil. Mengalihkan...";

        setTimeout(() => {
            window.location.href = "/dashboard.html";
        }, 600);

    } catch (error) {
        status.textContent = error.message;
    }

});

</script>

</body>
</html>
