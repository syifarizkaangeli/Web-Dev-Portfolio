<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form.site</title>
    <link rel="stylesheet" href="hire.css">
</head>
<body>

<main class="hire-page">

    <div class="hire-card">

        <p class="eyebrow">WORK WITH ME</p>
        <h1>Hubungi Saya</h1>
        <p>Jelaskan project yang ingin kamu buat. Saya akan menghubungi kamu melalui email.</p>

        <form id="hireForm">
            <input id="name" type="text" placeholder="Nama" required>
            <input id="email" type="email" placeholder="Email" required>
            <input id="project" type="text" placeholder="Nama project" required>
            <textarea id="message" placeholder="Ceritakan kebutuhan project..." required></textarea>

            <button type="submit" class="btn primary">Kirim Request</button>

            <p id="status"></p>
        </form>

        <p style="text-align:center;margin-top:15px;"><a href="/" style="color:#460404;">&larr; Kembali ke beranda</a></p>

    </div>

</main>

<script src="hire.js"></script>

</body>
</html>
