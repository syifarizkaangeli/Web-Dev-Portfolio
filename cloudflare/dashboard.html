<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">

</head>

<body>

<header class="navbar">

    <a href="/" class="logo">
        Portfolio<span>.</span>
    </a>

    <nav>

        <a href="/">Website</a>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </nav>

</header>


<main class="dashboard">

    <div class="dashboard-head">

        <div>

            <p class="eyebrow">
                ADMIN PANEL
            </p>

            <h1>Dashboard</h1>

        </div>

        <a
            href="/hire.html"
            class="btn primary"
        >
            View Hire Page
        </a>

    </div>


    <div class="stats">

        <div class="stat-card">

            <span>Total Pesan</span>

            <strong id="messageCount">
                -
            </strong>

        </div>

        <div class="stat-card">

            <span>Total Project</span>

            <strong id="projectCount">
                -
            </strong>

        </div>

    </div>


    <section class="dashboard-card">

        <div class="card-head">

            <h2>Pesan Terbaru</h2>

            <button
                class="refresh"
                onclick="loadMessages()"
            >
                Refresh
            </button>

        </div>

        <div id="messages">

            Loading...

        </div>

    </section>


    <section class="dashboard-card">

        <div class="card-head">

            <h2>Projects</h2>

        </div>

        <div id="projects">

            Loading...

        </div>

    </section>

</main>


<script src="dashboard.js"></script>

</body>
</html>
